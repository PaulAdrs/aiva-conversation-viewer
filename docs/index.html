<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AIVA Conversation Viewer</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --surface-primary: #FFFEFA;
    --surface-secondary: #F7F6F0;
    --surface-brand: #008F6D;
    --surface-brand-tint: #E4F2ED;
    --text-primary: #1A3C36;
    --text-secondary: #4D6763;
    --text-brand: #008F6D;
    --text-invert: #FFFEFA;
    --border: #B3BEBC;
    --error: #C45C6E;
    --font-display: 'ITC Garamond Narrow', Georgia, 'Times New Roman', serif;
    --font-body: 'Fellix', 'Helvetica Neue', Arial, sans-serif;
    --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  /* Several elements below set their own `display` (flex, etc.), which at
     equal CSS specificity beats the browser's default `[hidden]{display:none}`
     rule since author styles outrank the user-agent stylesheet. Without this,
     toggling .hidden in JS stops actually hiding anything. */
  [hidden] { display: none !important; }
  body {
    margin: 0;
    font-family: var(--font-body);
    background: var(--surface-secondary);
    color: var(--text-primary);
  }
  .eyebrow {
    font-family: var(--font-mono);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: 11px;
    color: var(--text-secondary);
  }
  header {
    padding: 20px 24px;
    border-bottom: 0.5px solid var(--border);
    background: var(--surface-primary);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header .title h1 {
    margin: 0 0 4px;
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 24px;
    color: var(--text-primary);
  }
  header .title p {
    margin: 0;
    color: var(--text-secondary);
    font-size: 13px;
  }
  header button.back {
    font-family: var(--font-mono);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding: 10px 16px;
    background: transparent;
    border: 0.5px solid var(--border);
    border-radius: 8px;
    color: var(--text-primary);
    font-size: 11px;
    cursor: pointer;
  }
  header button.back:hover { border-color: var(--surface-brand); color: var(--text-brand); }
  main {
    padding: 24px;
    max-width: 900px;
    margin: 0 auto;
  }
  .card {
    background: var(--surface-primary);
    border: 0.5px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin-bottom: 10px;
    cursor: pointer;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .card:hover {
    border-color: var(--surface-brand);
    box-shadow: 0 2px 8px rgba(0,38,32,0.08);
  }
  .card .row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .card .name {
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
  }
  .card .meta {
    font-size: 12.5px;
    color: var(--text-secondary);
    margin-top: 4px;
  }
  .badge {
    display: inline-block;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--surface-brand-tint);
    color: var(--text-brand);
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .unlock-box {
    max-width: 360px;
    margin: 80px auto;
    background: var(--surface-primary);
    border: 0.5px solid var(--border);
    border-radius: 8px;
    padding: 32px;
    text-align: center;
  }
  .unlock-box h1 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 22px;
    margin: 0 0 20px;
    color: var(--text-primary);
  }
  input[type="password"], input[type="text"] {
    width: 100%;
    padding: 11px 12px;
    background: var(--surface-primary);
    border: 0.5px solid var(--border);
    border-radius: 8px;
    color: var(--text-primary);
    font-family: var(--font-body);
    font-size: 14px;
    margin-bottom: 10px;
  }
  input[type="password"]:focus, input[type="text"]:focus {
    outline: none;
    border-color: var(--surface-brand);
  }
  button.primary {
    width: 100%;
    height: 44px;
    padding: 0 18px;
    background: var(--surface-brand);
    border: none;
    border-radius: 8px;
    color: var(--text-invert);
    font-family: var(--font-mono);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: 12px;
    cursor: pointer;
  }
  button.primary:hover { opacity: 0.88; }
  button.primary:disabled { opacity: 0.5; cursor: default; }
  button.secondary {
    padding: 0 16px;
    height: 38px;
    background: transparent;
    border: 0.5px solid var(--border);
    border-radius: 8px;
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-size: 11px;
    cursor: pointer;
    white-space: nowrap;
  }
  button.secondary:hover { border-color: var(--surface-brand); color: var(--text-brand); }
  button.secondary:disabled { opacity: 0.5; cursor: default; }
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }
  .status {
    color: var(--text-secondary);
    font-size: 14px;
    margin-bottom: 16px;
  }
  .status.error { color: var(--error); }
  .item {
    border: 0.5px solid var(--border);
    border-radius: 8px;
    padding: 12px 16px;
    margin-bottom: 10px;
    background: var(--surface-primary);
  }
  .item .meta {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--text-secondary);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .item.message.user { background: var(--surface-secondary); }
  .item.message.assistant { background: var(--surface-brand-tint); }
  .item.tool {
    background: var(--surface-secondary);
    border-left: 3px solid var(--surface-brand);
  }
  .item pre {
    margin: 6px 0 0;
    white-space: pre-wrap;
    word-break: break-word;
    font-family: var(--font-mono);
    font-size: 12px;
    background: rgba(26,60,54,0.05);
    padding: 8px;
    border-radius: 6px;
  }
  .item .content {
    font-size: 14px;
    white-space: pre-wrap;
    color: var(--text-primary);
  }
  .pagination-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 16px;
  }
  .page-tab {
    min-width: 34px;
    height: 30px;
    padding: 0 8px;
    background: var(--surface-primary);
    border: 0.5px solid var(--border);
    border-radius: 6px;
    color: var(--text-primary);
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  .page-tab:hover { border-color: var(--surface-brand); }
  .page-tab:disabled { opacity: 0.4; cursor: default; }
  .page-tab:disabled:hover { border-color: var(--border); }
  .page-ellipsis {
    display: inline-flex;
    align-items: center;
    padding: 0 2px;
    color: var(--text-secondary);
    font-family: var(--font-mono);
    font-size: 12px;
  }
  .page-tab.active {
    background: var(--surface-brand);
    border-color: var(--surface-brand);
    color: var(--text-invert);
  }
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(26,60,54,0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 10;
  }
  .modal {
    width: 100%;
    max-width: 360px;
    background: var(--surface-primary);
    border: 0.5px solid var(--border);
    border-radius: 8px;
    padding: 24px;
  }
  .modal h2 {
    font-family: var(--font-display);
    font-weight: 400;
    font-size: 20px;
    margin: 0 0 16px;
    color: var(--text-primary);
  }
  .modal .option-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    margin-bottom: 10px;
    cursor: pointer;
  }
  .modal .date-range {
    display: flex;
    gap: 10px;
    margin: 4px 0 14px 24px;
  }
  .modal .date-range label {
    font-size: 11.5px;
    color: var(--text-secondary);
    display: block;
    margin-bottom: 4px;
  }
  .modal input[type="date"] {
    width: 100%;
    padding: 8px 10px;
    background: var(--surface-primary);
    border: 0.5px solid var(--border);
    border-radius: 6px;
    color: var(--text-primary);
    font-family: var(--font-body);
    font-size: 13px;
  }
  .modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 18px;
  }
  .modal-actions button.secondary, .modal-actions button.primary {
    flex: 1;
    width: auto;
  }
</style>
</head>
<body>
<header>
  <div class="title">
    <h1 id="headerTitle">AIVA Conversation Viewer</h1>
    <p id="headerSubtitle">Testing tool &mdash; browse an agent's recent calls and inspect each transcript.</p>
  </div>
  <button class="back" id="backBtn" hidden>&larr; Back</button>
</header>
<main>
  <div id="unlockScreen" class="unlock-box">
    <h1>Enter access code</h1>
    <input type="password" id="accessCode" placeholder="Access code" />
    <button class="primary" id="unlockBtn">Unlock</button>
    <div id="unlockStatus" class="status"></div>
  </div>

  <div id="appScreen" hidden>
    <div class="toolbar">
      <div id="status" class="status" style="margin-bottom:0;"></div>
      <button class="secondary" id="exportBtn" hidden>Export all calls</button>
    </div>
    <div id="content"></div>
    <div id="paginationTabs" class="pagination-tabs" hidden></div>
  </div>
</main>

<div id="exportModal" class="modal-overlay" hidden>
  <div class="modal">
    <h2>Export all calls</h2>
    <label class="option-row">
      <input type="radio" name="exportRange" id="exportRangeAll" value="all" checked />
      All time
    </label>
    <label class="option-row">
      <input type="radio" name="exportRange" id="exportRangeCustom" value="custom" />
      Custom date range
    </label>
    <div id="exportDateRange" class="date-range" hidden>
      <div>
        <label for="exportStart">From</label>
        <input type="date" id="exportStart" />
      </div>
      <div>
        <label for="exportEnd">To</label>
        <input type="date" id="exportEnd" />
      </div>
    </div>
    <div id="exportModalStatus" class="status"></div>
    <div class="modal-actions">
      <button class="secondary" id="exportCancelBtn">Cancel</button>
      <button class="primary" id="exportConfirmBtn">Export</button>
    </div>
  </div>
</div>

<script>
  // Fill this in after deploying the Cloudflare Worker (wrangler deploy prints the URL).
  const WORKER_URL = "https://aiva-conversation-viewer.b00784180.workers.dev";

  let accessCode = "";
  let selectedAgent = null; // { id, name }

  const unlockScreen = document.getElementById("unlockScreen");
  const appScreen = document.getElementById("appScreen");
  const accessCodeInput = document.getElementById("accessCode");
  const unlockBtn = document.getElementById("unlockBtn");
  const unlockStatus = document.getElementById("unlockStatus");
  const backBtn = document.getElementById("backBtn");
  const exportBtn = document.getElementById("exportBtn");
  const statusEl = document.getElementById("status");
  const contentEl = document.getElementById("content");
  const paginationTabsEl = document.getElementById("paginationTabs");
  const headerSubtitle = document.getElementById("headerSubtitle");
  const exportModal = document.getElementById("exportModal");
  const exportRangeAll = document.getElementById("exportRangeAll");
  const exportRangeCustom = document.getElementById("exportRangeCustom");
  const exportDateRange = document.getElementById("exportDateRange");
  const exportStart = document.getElementById("exportStart");
  const exportEnd = document.getElementById("exportEnd");
  const exportModalStatus = document.getElementById("exportModalStatus");
  const exportCancelBtn = document.getElementById("exportCancelBtn");
  const exportConfirmBtn = document.getElementById("exportConfirmBtn");

  // Pagination state for the conversations list currently on screen.
  // pageCursors[i] is the "after" cursor needed to fetch page i+1 — index 0
  // is always null (page 1 needs no cursor). A page's own cursor becomes
  // known the moment that page's response comes back, but `visitedPages`
  // (not pageCursors.length) is what drives the number tabs, so a new page
  // number only ever shows up once you've actually navigated to it via
  // Next — not the instant its cursor becomes available.
  let pageCursors = [null];
  let currentPageNum = 1;
  let visitedPages = 1;
  let lastHasMore = false;

  // The admin API has no total-count field — listConversations only ever
  // says "here's a page, and whether there's more". The only way to know
  // the real total page count is to walk every page once and count, which
  // costs one request per page. So: show page 1 immediately, and fill in
  // the full "1 2 3 ... 8 9" pager a moment later once that background
  // walk finishes — cached per agent so it's instant after the first time.
  let agentTotalPagesCache = {}; // agentId -> { totalPages, exact }
  const COUNT_MAX_PAGES = 50; // ~1000 conversations at the current page size; beyond this we just label the last known page "N+"

  unlockBtn.addEventListener("click", unlock);
  accessCodeInput.addEventListener("keydown", (e) => { if (e.key === "Enter") unlock(); });
  backBtn.addEventListener("click", () => {
    if (backBtn.dataset.target === "agents") loadAgents();
    else if (backBtn.dataset.target === "conversations") loadConversationsPage(selectedAgent, currentPageNum);
  });
  exportBtn.addEventListener("click", openExportModal);
  exportCancelBtn.addEventListener("click", closeExportModal);
  exportConfirmBtn.addEventListener("click", confirmExport);
  exportRangeAll.addEventListener("change", updateExportRangeVisibility);
  exportRangeCustom.addEventListener("change", updateExportRangeVisibility);

  function updateExportRangeVisibility() {
    exportDateRange.hidden = !exportRangeCustom.checked;
  }

  async function unlock() {
    const code = accessCodeInput.value.trim();
    if (!code) return;
    accessCode = code;
    unlockBtn.disabled = true;
    setUnlockStatus("Checking...", false);

    // Any real endpoint doubles as the auth check; agents list is the cheapest.
    const result = await apiFetch({ view: "agents" });
    if (!result.ok) {
      setUnlockStatus(result.error || "Invalid access code", true);
      unlockBtn.disabled = false;
      accessCode = "";
      return;
    }

    unlockScreen.hidden = true;
    appScreen.hidden = false;
    renderAgents(result.data.agents);
  }

  function setUnlockStatus(text, isError) {
    unlockStatus.textContent = text;
    unlockStatus.className = "status" + (isError ? " error" : "");
  }

  function setStatus(text, isError) {
    statusEl.textContent = text;
    statusEl.className = "status" + (isError ? " error" : "");
  }

  async function apiFetch(params) {
    try {
      const qs = new URLSearchParams(params).toString();
      const resp = await fetch(`${WORKER_URL}?${qs}`, {
        headers: { "X-Access-Code": accessCode },
      });
      const data = await resp.json();
      if (!resp.ok) return { ok: false, error: data.error || `Request failed (${resp.status})` };
      return { ok: true, data };
    } catch (err) {
      return { ok: false, error: `Network error: ${err.message}` };
    }
  }

  async function loadAgents() {
    selectedAgent = null;
    backBtn.hidden = true;
    headerSubtitle.textContent = "Select an agent.";
    setStatus("Loading agents...", false);
    contentEl.innerHTML = "";

    const result = await apiFetch({ view: "agents" });
    if (!result.ok) { setStatus(result.error, true); return; }
    renderAgents(result.data.agents);
  }

  function renderAgents(agents) {
    backBtn.hidden = true;
    exportBtn.hidden = true;
    paginationTabsEl.hidden = true;
    headerSubtitle.textContent = "Select an agent.";
    setStatus(agents.length ? "" : "No agents found.", false);
    contentEl.innerHTML = agents.map((a) => `
      <div class="card" data-agent-id="${escapeHtml(a.id)}" data-agent-name="${escapeHtml(a.name)}">
        <div class="row">
          <span class="name">${escapeHtml(a.name)}</span>
          <span class="badge">${escapeHtml(a.language || "")}</span>
        </div>
        <div class="meta">Updated ${a.updatedAt ? new Date(a.updatedAt).toLocaleString() : "unknown"}</div>
      </div>
    `).join("");

    contentEl.querySelectorAll(".card").forEach((card) => {
      card.addEventListener("click", () => {
        loadConversations({ id: card.dataset.agentId, name: card.dataset.agentName });
      });
    });
  }

  // Entry point when an agent is (re)selected — resets pagination to page 1
  // and kicks off the background total-page count (unless already cached).
  async function loadConversations(agent) {
    pageCursors = [null];
    visitedPages = 1;
    await loadConversationsPage(agent, 1);
    ensureTotalPagesKnown(agent);
  }

  async function loadConversationsPage(agent, pageNum) {
    selectedAgent = agent;
    currentPageNum = pageNum;
    backBtn.hidden = false;
    backBtn.dataset.target = "agents";
    headerSubtitle.textContent = `${agent.name} — recent calls (page ${pageNum})`;
    setStatus("Loading conversations...", false);
    contentEl.innerHTML = "";
    paginationTabsEl.hidden = true;

    const params = { view: "conversations", agentId: agent.id };
    const cursor = pageCursors[pageNum - 1];
    if (cursor) params.after = cursor;

    const result = await apiFetch(params);
    if (!result.ok) { setStatus(result.error, true); return; }

    const { conversations, hasMore, nextCursor } = result.data;
    lastHasMore = hasMore;
    if (hasMore && nextCursor && pageCursors.length === pageNum) {
      pageCursors.push(nextCursor);
    }
    visitedPages = Math.max(visitedPages, pageNum);
    renderConversations(conversations);
    renderPaginationTabs();
  }

  // Walks every page of this agent's conversations just to count them —
  // the only way to get a total, since the API doesn't expose one. Runs
  // in the background; doesn't block showing page 1. Capped so a
  // call-heavy agent doesn't turn into a very long background walk.
  function ensureTotalPagesKnown(agent) {
    if (agentTotalPagesCache[agent.id]) { renderPaginationTabs(); return; }
    countTotalPages(agent).then((info) => {
      agentTotalPagesCache[agent.id] = info;
      if (selectedAgent && selectedAgent.id === agent.id) renderPaginationTabs();
    });
  }

  async function countTotalPages(agent) {
    let cursor = undefined;
    for (let pages = 0; pages < COUNT_MAX_PAGES; ) {
      const params = { view: "conversations", agentId: agent.id };
      if (cursor) params.after = cursor;
      const result = await apiFetch(params);
      pages++;
      if (!result.ok) return { totalPages: Math.max(pages - 1, 1), exact: false };
      const { hasMore, nextCursor } = result.data;
      if (!hasMore || !nextCursor) return { totalPages: pages, exact: true };
      cursor = nextCursor;
    }
    return { totalPages: COUNT_MAX_PAGES, exact: false };
  }

  // Which page numbers to actually render as tabs, collapsing with "..."
  // once there are more than a handful — classic `1 2 ... 8 9` pager shape.
  function computePageList(current, maxPage) {
    if (maxPage <= 7) return Array.from({ length: maxPage }, (_, i) => i + 1);
    const keep = new Set([1, 2, maxPage - 1, maxPage, current - 1, current, current + 1]);
    return [...keep].filter((p) => p >= 1 && p <= maxPage).sort((a, b) => a - b);
  }

  function renderPaginationTabs() {
    const cached = selectedAgent ? agentTotalPagesCache[selectedAgent.id] : null;
    // Once the real total is known, it always wins — but if the user has
    // clicked past a capped estimate, don't let the tab list shrink under them.
    const maxPage = cached ? Math.max(cached.totalPages, visitedPages) : visitedPages;
    const stillUnbounded = !cached && lastHasMore;

    if (maxPage <= 1 && !stillUnbounded) {
      paginationTabsEl.hidden = true;
      return;
    }

    const pages = computePageList(currentPageNum, maxPage);
    let html = `<button class="page-tab" id="pagePrev" ${currentPageNum === 1 ? "disabled" : ""}>&lt;</button>`;
    let prev = 0;
    for (const p of pages) {
      if (p - prev > 1) html += `<span class="page-ellipsis">...</span>`;
      const isCappedEdge = cached && !cached.exact && p === cached.totalPages && p === maxPage;
      html += `<button class="page-tab${p === currentPageNum ? " active" : ""}" data-page="${p}">${p}${isCappedEdge ? "+" : ""}</button>`;
      prev = p;
    }
    const canGoNext = currentPageNum < maxPage || (currentPageNum === maxPage && lastHasMore);
    html += `<button class="page-tab" id="pageNext" ${canGoNext ? "" : "disabled"}>&gt;</button>`;

    paginationTabsEl.innerHTML = html;
    paginationTabsEl.hidden = false;
    paginationTabsEl.querySelectorAll(".page-tab[data-page]").forEach((btn) => {
      btn.addEventListener("click", () => loadConversationsPage(selectedAgent, parseInt(btn.dataset.page, 10)));
    });
    const prevBtn = document.getElementById("pagePrev");
    const nextBtn = document.getElementById("pageNext");
    if (!prevBtn.disabled) prevBtn.addEventListener("click", () => loadConversationsPage(selectedAgent, currentPageNum - 1));
    if (!nextBtn.disabled) nextBtn.addEventListener("click", () => loadConversationsPage(selectedAgent, currentPageNum + 1));
  }

  function renderConversations(conversations) {
    exportBtn.hidden = conversations.length === 0 && currentPageNum === 1;
    exportBtn.disabled = false;
    exportBtn.textContent = "Export all calls";
    setStatus(conversations.length ? "" : "No conversations found for this agent.", false);
    contentEl.innerHTML = conversations.map((c) => `
      <div class="card" data-conversation-id="${escapeHtml(c.id)}">
        <div class="row">
          <span class="name">${escapeHtml(c.callId || c.id)}</span>
          <span class="badge">${c.messageCount} messages</span>
        </div>
        <div class="meta">${c.phoneNumber ? escapeHtml(c.phoneNumber) + " &middot; " : ""}${new Date(c.createdAt).toLocaleString()} &middot; ${escapeHtml(c.status || "")}</div>
      </div>
    `).join("");

    contentEl.querySelectorAll(".card").forEach((card) => {
      card.addEventListener("click", () => loadTranscript(card.dataset.conversationId));
    });
  }

  async function loadTranscript(conversationId) {
    backBtn.hidden = false;
    exportBtn.hidden = true;
    paginationTabsEl.hidden = true;
    backBtn.dataset.target = "conversations";
    headerSubtitle.textContent = `${selectedAgent.name} — call transcript`;
    setStatus("Loading transcript...", false);
    contentEl.innerHTML = "";

    const result = await apiFetch({ conversationId });
    if (!result.ok) { setStatus(result.error, true); return; }
    const { conversation, toolCalls, toolCallsTruncated } = result.data;
    renderTimeline(conversation, toolCalls);
    const base = `Loaded ${conversation.messages.length} messages and ${toolCalls.length} tool calls.`;
    const warning = toolCallsTruncated
      ? " Some older tool-call logs on this call were too large to load and were left out."
      : "";
    setStatus(base + warning, toolCallsTruncated);
  }

  function renderTimeline(conversation, toolCalls) {
    const items = [];

    for (const m of conversation.messages) {
      items.push({ type: "message", role: m.role, createdAt: m.createdAt, content: m.content });
    }
    for (const t of toolCalls) {
      items.push({ type: "tool", createdAt: t.requestedAt || t.respondedAt, call: t });
    }

    items.sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));

    contentEl.innerHTML = items.map(renderItem).join("");
  }

  function renderItem(item) {
    const time = new Date(item.createdAt).toLocaleString();

    if (item.type === "message") {
      return `
        <div class="item message ${escapeHtml(item.role)}">
          <div class="meta">${escapeHtml(item.role)} &middot; ${time}</div>
          <div class="content">${escapeHtml(item.content)}</div>
        </div>
      `;
    }

    const call = item.call;
    return `
      <div class="item tool">
        <div class="meta">tool call: ${escapeHtml(call.name)} ${call.outcome ? `(${escapeHtml(call.outcome)})` : ""} &middot; ${time}</div>
        <div class="content">Arguments:</div>
        <pre>${escapeHtml(prettyPrint(call.arguments))}</pre>
        <div class="content">Result:</div>
        <pre>${escapeHtml(prettyPrint(call.result))}</pre>
      </div>
    `;
  }

  const EXPORT_CONCURRENCY = 4;
  // Safety cap so a huge "All time" export on a long-lived agent can't run
  // forever — if this is hit, the export still downloads what it found,
  // but says so rather than silently being incomplete.
  const MAX_EXPORT_CONVERSATIONS = 1000;

  function openExportModal() {
    exportRangeAll.checked = true;
    updateExportRangeVisibility();
    exportStart.value = "";
    exportEnd.value = "";
    exportModalStatus.textContent = "";
    exportModalStatus.className = "status";
    exportConfirmBtn.disabled = false;
    exportConfirmBtn.textContent = "Export";
    exportModal.hidden = false;
  }

  function closeExportModal() {
    exportModal.hidden = true;
  }

  async function confirmExport() {
    const allTime = exportRangeAll.checked;
    let startDate = null;
    let endDate = null;

    if (!allTime) {
      if (!exportStart.value || !exportEnd.value) {
        exportModalStatus.textContent = "Pick both a start and end date.";
        exportModalStatus.className = "status error";
        return;
      }
      startDate = new Date(exportStart.value + "T00:00:00");
      endDate = new Date(exportEnd.value + "T23:59:59.999");
      if (startDate > endDate) {
        exportModalStatus.textContent = "Start date must be before end date.";
        exportModalStatus.className = "status error";
        return;
      }
    }

    exportConfirmBtn.disabled = true;
    exportConfirmBtn.textContent = "Scanning...";

    const { matched, limitReached, error } = await collectConversationsInRange(
      selectedAgent, startDate, endDate,
      (scanned) => { exportModalStatus.textContent = `Scanning calls... ${scanned} found so far.`; exportModalStatus.className = "status"; }
    );

    if (error) {
      exportModalStatus.textContent = error;
      exportModalStatus.className = "status error";
      exportConfirmBtn.disabled = false;
      exportConfirmBtn.textContent = "Export";
      return;
    }

    if (!matched.length) {
      exportModalStatus.textContent = "No calls found in that range.";
      exportModalStatus.className = "status error";
      exportConfirmBtn.disabled = false;
      exportConfirmBtn.textContent = "Export";
      return;
    }

    closeExportModal();
    const rangeLabel = allTime ? "all-time" : `${exportStart.value}-to-${exportEnd.value}`;
    await exportAllCalls(matched, rangeLabel, limitReached);
  }

  // Walks listConversations pages (independent of whatever page is on
  // screen) collecting every conversation inside [startDate, endDate].
  // Results come back newest-first, so once an item's createdAt is older
  // than startDate, everything after it is older too — stop right there
  // instead of walking the agent's entire history.
  async function collectConversationsInRange(agent, startDate, endDate, onProgress) {
    const matched = [];
    let cursor = undefined;
    for (let page = 0; ; page++) {
      const params = { view: "conversations", agentId: agent.id };
      if (cursor) params.after = cursor;
      const result = await apiFetch(params);
      if (!result.ok) return { matched, error: result.error };

      const { conversations, hasMore, nextCursor } = result.data;
      let stop = false;
      for (const c of conversations) {
        const t = new Date(c.createdAt).getTime();
        if (endDate && t > endDate.getTime()) continue;
        if (startDate && t < startDate.getTime()) { stop = true; break; }
        matched.push(c);
        if (matched.length >= MAX_EXPORT_CONVERSATIONS) { stop = true; break; }
      }
      if (onProgress) onProgress(matched.length);
      if (stop || !hasMore || !nextCursor) {
        return { matched, limitReached: matched.length >= MAX_EXPORT_CONVERSATIONS };
      }
      cursor = nextCursor;
    }
  }

  async function exportAllCalls(conversations, rangeLabel, limitReached) {
    if (!conversations.length) return;

    exportBtn.disabled = true;
    const results = new Array(conversations.length);
    let done = 0;
    let failed = 0;

    const updateProgress = () => {
      setStatus(`Exporting calls... ${done}/${conversations.length}${failed ? ` (${failed} failed)` : ""}`, false);
      exportBtn.textContent = `Exporting ${done}/${conversations.length}...`;
    };
    updateProgress();

    let nextIndex = 0;
    async function worker() {
      while (nextIndex < conversations.length) {
        const i = nextIndex++;
        const summary = conversations[i];
        const result = await apiFetch({ conversationId: summary.id });
        if (result.ok) {
          results[i] = {
            callId: summary.callId,
            phoneNumber: summary.phoneNumber,
            status: summary.status,
            conversation: result.data.conversation,
            toolCalls: result.data.toolCalls,
            toolCallsTruncated: result.data.toolCallsTruncated,
          };
        } else {
          failed++;
          results[i] = { callId: summary.callId, error: result.error };
        }
        done++;
        updateProgress();
      }
    }

    const workers = Array.from({ length: Math.min(EXPORT_CONCURRENCY, conversations.length) }, worker);
    await Promise.all(workers);

    downloadJson(
      { agent: selectedAgent.name, range: rangeLabel, exportedAt: new Date().toISOString(), calls: results },
      `${slugify(selectedAgent.name)}-calls-${rangeLabel}.json`
    );

    exportBtn.disabled = false;
    exportBtn.textContent = "Export all calls";
    const limitNote = limitReached ? ` Stopped at the ${MAX_EXPORT_CONVERSATIONS}-call cap — narrow the date range to get the rest.` : "";
    setStatus(`Exported ${done - failed}/${conversations.length} calls${failed ? ` (${failed} failed)` : ""}.${limitNote}`, failed > 0 || limitReached);
  }

  function downloadJson(data, filename) {
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
  }

  function slugify(str) {
    return String(str ?? "agent").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") || "agent";
  }

  function prettyPrint(value) {
    if (value === undefined) return "(none)";
    return typeof value === "string" ? value : JSON.stringify(value, null, 2);
  }

  function escapeHtml(str) {
    return String(str ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    }[c]));
  }
</script>
</body>
</html>
